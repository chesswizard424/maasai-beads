    <section class="catalogue">

    <div class="search-box">
        <input
            type="text"
            id="search-input"
            placeholder="Search products..."
        >
    </div>

<div class="sort-box">
    <label for="sort-select">Sort by:</label>
<button id="clear-filters" class="clear-filters">
    Clear Filters
</button>

    <select id="sort-select">
        <option value="default">Default</option>
        <option value="price-low">Price: Low → High</option>
        <option value="price-high">Price: High → Low</option>
        <option value="name-az">Name: A → Z</option>
        <option value="name-za">Name: Z → A</option>
    </select>
</div>

    <div class="filters">

 <button class="filter-btn active" data-category="All">All</button>
<button class="filter-btn" data-category="Necklaces">Necklaces</button>
<button class="filter-btn" data-category="Bracelets">Bracelets</button>
<button class="filter-btn" data-category="Earrings">Earrings</button>
<button class="filter-btn" data-category="Other">Other</button>
<button class="filter-btn" data-category="Belts">Belts</button>
<button class="filter-btn" data-category="Beaded Hats">Beaded Hats</button>
<button class="filter-btn" data-category="Beaded Outfits">Beaded Outfits</button>
<button class="filter-btn" data-category="Maasai Rungus">Maasai Rungus</button>
<button class="filter-btn" data-category="Maasai Beaded Sandals">Sandals</button>
<button class="filter-btn" data-category="Bags">Bags</button>
<button class="filter-btn" data-category="Pouches">Pouches</button>
<button class="filter-btn" data-category="Mats">Mats</button>
<button class="filter-btn" data-category="Headwear">Headwear</button>
<button class="filter-btn" data-category="Key Holders">Key Holders</button>

        <!-- Products -->

<p id="product-count" class="product-count">
    Showing 0 products
</p>

        <div class="product-grid" id="product-grid">
        </div>

        <p>
